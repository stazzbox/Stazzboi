eight:700}.route a:hover{border-color:var(--blue);text-decoration:none;box-shadow:0 2px 7px #0002}.back{display:block;border:1px solid var(--border);background:var(--light);padding:9px 10px;margin-top:12px;font-size:12px;font-weight:700}.back:hover{text-decoration:none;border-color:var(--blue)}.footer{border-top:1px solid var(--border);background:var(--light);padding:12px;font-size:10px;color:var(--muted)}.footer strong{color:var(--text)}@media(min-width:700px){body{padding:20px 0}.phone{min-height:0;border:1px solid #c8ccd1}}</style><link rel="stylesheet" href="/assets/stazz-app.css?v=20260928"></head><body><div class="phone"><header class="topbar"><div class="topbar-inner"><a class="brand" href="/">Stazzboi.com</a><span class="powered">powered by <b>the STAZZEX</b></span></div></header><main><div class="crumb"><a href="/">Home</a> › <a href="/stazzex/">The Stazzex</a> › Entry</div><div class="title"><h1 id="title">STAZZEX Entry</h1><p id="subtitle">Official Stazzian Index entry</p></div><section class="entry-card"><div class="entry-meta" id="meta"></div><div class="definition" id="definition"></div><div class="route" id="route"></div></section><a class="back" href="/stazzex/">← Back to The Stazzex</a></main><footer class="footer"><strong>Stazzboi.com powered by the STAZZEX</strong><br>Official Stazzian Index interface.</footer></div><script>const D={
"001":["The Stazzex","Index",`The Stazzex is the official Stazzerian Index for the Stazzerian Framework. It is the structured reference system containing the defined terms, names, concepts, roles, institutions, expressions, and other recognized elements that collectively constitute the Stazzerian Framework.`],
"002":["Kelvin Stazzland","Person",`Kelvin “The Khamelion” Stazzland, professionally known as Stazzboi, is a Stazzerian-American content creator, entertainer, producer, musician, and Internet personality. He is the founder and President of Stazzeria and the principal creator behind the Stazzerian cultural framework, including STAZZsociety, Stazzism, The Stazzex, and Stazzology.`],
"003":["Action Over Words","Stazzism / Foundational Principle",`Action Over Words is a foundational Stazzist principle affirming that meaningful action and responsible implementation carry greater value than declarations without follow-through. It encourages informed decision-making and thoughtful execution, not action without knowledge.`]
"004":["Adopted","Citizenship",`Adopted Stazzerian is a Stazzerian citizenship classification for an individual who becomes a recognized citizen of Stazzeria through formal adoption or endorsement rather than through direct lineage. An Adopted Stazzerian is recognized as a member of the Stazzerian community without possessing birthright citizenship.`],
"005":["Against All Odds","Event",`Against All Odds is an event hosted by Stazzology as part of the Stazzology Season. It is one of multiple events organized under Stazzology's seasonal programming.`]
"006":["BeachyBird","Person",`BeachyBird is the professional name of Isaac Ochoa, a content creator and videographer closely associated with Stazzeria. He serves as the Stazzerian Vice President and is a close friend and creative collaborator of Kelvin Stazzland, professionally known as Stazzboi. Together, they form a creator-and-cameraman duo associated with Stazzerian media and content creation.`],
"007":["Birthright","Citizenship",`Birthright refers to Birthright Stazzerian citizenship, a Stazzerian citizenship classification granted through direct lineage. A Birthright Stazzerian is recognized as a citizen of Stazzeria by virtue of being born into the established Stazzerian lineage.`],
"008":["Citizen","Citizenship",`Citizen is a person formally recognized as a member of Stazzeria and entitled to participate within the Stazzerian community and framework. Stazzerian citizenship is classified into three categories: Birthright, Adopted, and Supporter.`],
"009":["Stazzeria","Nation / Collective Identity",`Stazzeria is the nation and collective identity of Stazzerians, founded by Kelvin Stazzland on April 15, 2017. The Digital Republic of Stazzeria was established in November 2025. Its capital is Kavik, and its primary digital territory and enduring archival infrastructure is The Stazzex.`]
"010":["Direct Lineage","Citizenship Basis",`Direct Lineage refers to the familial or ancestral connection through which an individual qualifies for Birthright Stazzerian citizenship. It establishes a direct line of descent within the recognized Stazzerian lineage.`],
"011":["Stazzboi","Personal Brand / Media Identity",`Stazzboi is the personal creator, entertainment, and media brand of Kelvin “The Khamelion” Stazzland, a Stazzerian-American creator and founder of Stazzeria. Stazzboi encompasses creative productions, public content, promotion, and affiliated ventures within The Stazz Universe.`]
"012":["Endorsed","Citizenship Mechanism",`Endorsed refers to the basis of Adopted Stazzerian citizenship, in which an individual is formally recognized and accepted as a member of Stazzeria without qualifying through direct lineage. An endorsed individual may therefore become an Adopted Stazzerian through the established process of recognition and acceptance.`],
"013":["First Gentleman of Stazzeria","Title",`First Gentleman of Stazzeria is a formal Stazzerian title designated for the male spouse or romantic partner of the sitting Stazzerian President. The title identifies the President’s primary male partner within the Stazzerian executive and household structure.`],
"014":["First Lady of Stazzeria","Government / Executive Title",`First Lady of Stazzeria is a formal Stazzerian title designated for the female spouse or romantic partner of the sitting Stazzerian President. The title identifies the President’s primary female partner within the Stazzerian executive and household structure. Alternative office name: Stazzerian First Lady.`]
"015":["Frost","Team",`Frost is a team recognized within the Stazzology competitive event system. It is identified as one of the teams associated with Stazzology's organized activities and competitions.`]
"016":["Hitbox","Event",`Hitbox is an event hosted by Stazzology as part of the Stazzology Season. It is one of multiple events organized under Stazzology's seasonal programming.`]
"017":["“If the answer is obvious, implement it.”","Principle",`“If the answer is obvious, implement it.” is a Stazzist principle and call to action emphasizing decisive execution when a clear solution is already apparent. It advocates implementing an obvious and sufficiently understood answer rather than unnecessarily delaying action through overanalysis or hesitation. The principle is applicable broadly and is not limited to content creation.`],
"018":["Integrity","Team",`Integrity is a team recognized within the Stazzology competitive event system. It is identified as one of the teams associated with Stazzology's organized activities and competitions.`]
"019":["Isaac Ochoa","Person",`Isaac Ochoa is a Stazzerian-American creator and videographer professionally known as BeachyBird. He serves as the Stazzerian Vice President and is a close friend and creative collaborator of Kelvin Stazzland, professionally known as Stazzboi. Together, they form a creator-and-cameraman duo associated with Stazzerian media and content creation.`],
"020":["Kazik","Team",`Kazik is a team recognized within the Stazzology competitive event system. It is identified as one of the teams associated with Stazzology's organized activities and competitions.`]
"021":["Khamelion Pose","Concept",`The Khamelion Pose, also known as the Dual Peace-Sign Stance, is the signature pose associated with The Khamelion (Stazzboi). It is characterized by both hands forming peace-sign “V” shapes with the knuckles facing the spectator or camera, rather than the palms. The term Khamelion originated within Stazzland’s inner circle of close friends, family, and associates, who recognized his ability to adapt to different social environments and blend naturally into varied groups while maintaining his individual identity. The original spelling “chameleon” was subsequently transformed through Stazzation into “Khamelion.” The pose later became visually associated with The Khamelion through the Original Khamelion Pose photograph, connecting the inner-circle concept to a recognizable Stazzboi cultural expression. Within the Stazzerian Framework, the Khamelion Pose represents adaptability, creativity, confidence, social awareness, positive engagement, and authentic connection across different environments.`],
"022":["Kingdom","Team",`Kingdom is a team recognized within the Stazzology competitive event system. It is identified as one of the teams associated with Stazzology's organized activities and competitions.`]
"023":["Kiza Entertainment","Organization / Entertainment Institution",`Kiza Entertainment is an entertainment organization associated with Stazzboi and its creative operations, serving as an entertainment-side counterpart to the governmental Department of Stazz.`]
"024":["“Knowledge without action changes nothing.”","Maxim",`“Knowledge without action changes nothing.” is a foundational Stazzist principle emphasizing that knowledge alone does not produce meaningful change unless it is applied through deliberate action. The principle reinforces Action Over Knowledge by distinguishing understanding from implementation and encouraging purposeful execution.`],
"025":["M&M Pellets","Historical Element",`M&M Pellets are small, non-lethal projectiles associated with the Stazzerian Conflict, specifically documented as being used during the Zits Conflict. The term refers to M&M candy pieces repurposed as projectiles within the conflict’s history.`],
"026":["Parabox","Team",`Parabox is a team recognized within the Stazzology competitive event system. It is identified as one of the teams associated with Stazzology's organized activities and competitions.`]
"027":["Patrol 1","Institution",`Stazzerian Patrol 1 is the primary Stazzerian patrol responsible for handling citizen matters within the Stazzzerian Framework. It functions as an institutional component of Stazzerian governance and community administration.`],
"028":["Stazzerian Patrols","Institutional Activity / Patrol Operations",`Stazzerian Patrols are the operational patrol activities carried out by Patrol 1 in matters associated with Stazzerian citizens, property, and institutional interests; they are not a separate institution from Patrol 1.`]
"029":["Second Gentleman of Stazzeria","Title",`Second Gentleman of Stazzeria is a formal Stazzerian title designated for the male spouse or romantic partner of the sitting Stazzerian Vice President. The title identifies the Vice President’s primary male partner within the Stazzerian executive and household structure.`],
"030":["Second Lady of Stazzeria","Title",`Second Lady of Stazzeria is a formal Stazzerian title designated for the female spouse or romantic partner of the sitting Stazzerian Vice President. The title identifies the Vice President’s primary female partner within the Stazzerian executive and household structure.`],
"031":["Showdown","Event",`Showdown is an event hosted by Stazzology as part of the Stazzology Season. It is one of multiple events organized under Stazzology's seasonal programming.`]
"032":["Stazz","Term",`Stazz is a foundational Stazzerian term denoting a blessed frequency, state of positive alignment, resonance, and momentum within Stazzerian cultural understanding.`]
"033":["Stazzate","Action",`Stazzate is the active act of Stazzation—transforming concepts, media, branding, or systems into alignment with Stazz principles and Stazzerian identity.`],
"034":["Stazzation","Process",`Stazzation is the process of transforming concepts, media, branding, or systems into alignment with Stazz principles and Stazzerian identity.`],
"035":["Kelvin TV","Media Series",`Kelvin TV is a 2024 Internet series following Kelvin Stazzland in a vlog-style reality-show format. The series documents aspects of his life, including basketball, relationships, friendships, and experiences associated with him, presenting his personal life and surrounding social environment through episodic content.`],
"036":["Stazzed","State",`Stazzed describes being blessed, aligned, resonant, energized, or fully in a state of Stazz. It is the past-tense or active-status form of Stazz, describing the condition of something or someone that has attained or is presently experiencing Stazz.`],
"037":["Stazzerian","Adjective / Demonym / Collective Identity",`Stazzerian describes a person, association, practice, or identity connected with Stazzeria. The recognized community classifications are Birthright, Adopted (Endorsed), and Supporter.`]
"038":["Stazzerian Academy","Institution / Developmental Division",`The Stazzerian Academy is a development and talent-building division on the Stazzboi entertainment side, modeled on developmental competitive entertainment systems. It promotes Stazzerian principles and creative skills without conferring governmental authority.`]
"039":["Stazzerian Advisor","Government / Executive Title",`Stazzerian Advisor is a formal executive role within Stazzeria responsible for providing counsel, guidance, and strategic advice to the Stazzerian President and executive leadership. The Advisor supports informed decision-making and contributes experience, perspective, and expertise to the administration of Stazzeria. Alternative office name: Advisor of Stazzeria.`]
"040":["Stazzerian Secret Service","Institution",`The Stazzerian Secret Service is a protective and security institution within the Stazzerian Framework that functions similarly to a conventional secret service agency. The Stazzerian President assigns designated Stazzerians to serve as Secret Service operators and carry out protective, security, and other assigned missions. The identities and specific composition of the Stazzerian Secret Service are not publicly disclosed. Alternative office name: Secret Service of Stazzeria.`]
"041":["Stazzerian Assembly","Institution",`The Stazzerian Assembly is the fundamental collective formation of Stazzerians, beginning whenever two or more Stazzerians come together, thereby forming Stazzeria at its most basic social level. At an elevated level, the Stazzerian Assembly refers to a cultural gathering of Stazzerians for shared participation, discussion, community, and expression of Stazzerian identity.`],
"042":["Stazzerian Conflict","Historical / History",`Stazzerian Conflict refers to a conflict occurring within the history or history of Stazzeria involving Stazzerians, groups, or interests associated with the Stazzerian Framework. The term encompasses documented disputes and confrontations recognized as part of Stazzerian history, including the Zits Conflict.`],
"043":["Stazzerian Framework","Framework",`The Stazzerian Framework, commonly referred to as STAZZsociety, encompasses the interconnected language, collective identity, principles, governance, institutions, and cultural practices of Stazzeria.`]
"044":["Stazzerian Governance","Governance",`Stazzerian Governance is the system through which Stazzeria is organized, administered, and directed. It operates under Stazzerian Presidential Collectivism, in which the President serves as the head of state, government, and national direction while the collective participation of Stazzerians contributes to the formation of the nation’s will.`],
"045":["Stazzerian Index","Function",`Stazzerian Index is the formal indexing system of the Stazzerian Framework, serving as the organized reference structure for its defined terms, concepts, names, roles, institutions, and other recognized elements. The Stazzerian Index is formally represented by The Stazzex.`],
"046":["Stazzerian Monarch","Government / Executive Title",`Stazzerian Monarch is a formal executive role within Stazzeria that is not a traditional or sovereign monarchy. The Monarch functions as the President’s other hand within the executive structure and reports directly to the Stazzerian Vice President, creating a tri-structured leadership system consisting of the President, Vice President, and Monarch. Alternative office name: Monarch of Stazzeria.`]
"047":["Stazzerian Mediator","Government / Executive Title",`Stazzerian Mediator is a formal executive role within Stazzeria responsible for facilitating communication, resolving disputes, and promoting understanding between Stazzerians or parties within the Stazzerian Framework. The Mediator serves as a neutral intermediary when conflicts or disagreements require resolution. Alternative office name: Mediator of Stazzeria.`]
"048":["Stazzerian War General","Government / Executive Title",`Stazzerian War General is a formal executive role within Stazzeria responsible for coordinating and directing Stazzerian forces or participants during conflicts, disputes, or organized competitive engagements. The role represents the senior military or strategic authority within the Stazzerian executive structure. Alternative office name: War General of Stazzeria.`]
"049":["Stazzerian Vice President","Government / Executive Title",`Stazzerian Vice President is the second-highest executive role within Stazzeria and serves as the principal deputy to the Stazzerian President. The Vice President assists in directing Stazzerian affairs and serves as the central coordinating figure within the executive structure, including direct oversight of the Stazzerian Monarch. Alternative office name: Vice President of Stazzeria.`]
"050":["Stazzerian President","Government / Executive Title",`Stazzerian President is the highest executive office within Stazzeria and serves as the head of state, government, and national direction. The President establishes and safeguards the direction of Stazzeria while operating within the principles of Stazzerian Presidential Collectivism. Alternative office name: President of Stazzeria.`]
"051":["Stazzerian Presidential Collectivism","Governance System",`Stazzerian Presidential Collectivism is the governing system of Stazzeria in which the Stazzerian President serves as the head of state, government, and national direction while the collective participation of Stazzerians contributes to determining the will of the nation. The President is responsible for executing, directing, and safeguarding that collective will rather than governing solely through unilateral authority.`],
"052":["Stazzerian Tribalism","Social Concept",`Stazzerian Tribalism is the social and cultural characteristic of Stazzeria centered on strong group identity, loyalty, shared belonging, and interpersonal bonds among Stazzerians. It reflects the tendency of Stazzerians to organize around common identity, relationships, values, and collective interests within the Stazzerian Assembly.`],
"053":["Stazzerians","People",`Stazzerians are the people recognized as members or citizens of Stazzeria and participants within the Stazzerian Framework. The term collectively refers to individuals who hold a recognized connection to Stazzeria through Birthright, Adoption, or Supporter status.`],
"054":["Stazzert Comics (ASC)","Creative / Media",`Stazzert Comics (ASC) is a comics and manga-oriented creative production within The Stazz Universe, authored by Kelvin Stazzland.`]
"055":["Stazzex Series Finals","Event",`Stazzex Series Finals is a championship-level culmination of the Stazzology Season, where qualified participants or teams compete for the season championship.`]
"056":["Stazzian","Adjective / Historical & Cultural Term",`Stazzian is an adjective associated with Stazzerian culture, particularly its historical terminology, traditions, timelines, practices, and concepts.`]
"057":["Stazzian Estate","Place",`The Stazzian Estate is associated with the Stazzland birthright family and household. It is officially designated the Presidential Palace of Stazzeria.`]
"058":["Stazzerian Lexicon","Language Resource",`The Stazzerian Lexicon, historically also called the Stazzian Lexicon, is a formal reference of Stazzerian terms and their definitions.`]
"059":["Stazzerian Vocabulary","Language Resource",`Stazzerian Vocabulary, historically also called Stazzian Vocabulary, is the collection of expressions and words used in Stazzerian cultural language, distinct from the formal Lexicon reference.`]
"060":["Stazziciary","Institution",`Stazziciary is the judicial institution of Stazzeria responsible for presiding over matters of law, disputes, and formal adjudication within the Stazzerian Framework. It serves as the judicial branch of Stazzerian governance.`],
"061":["Stazziciary Authoritarian Court (SSAC)","Court",`The Stazziciary Authoritarian Court (SSAC) is a court associated with the judicial structure of Stazzeria, operating within the Stazziciary for formal adjudicative matters.`]
"062":["Stazzing","Action",`Stazzing is the active practice or expression of Stazz—the act of embodying, expressing, or engaging with the blessed frequency and its associated state of alignment, resonance, momentum, or positive energy. It is the active form of Stazz.`],
"063":["Stazzism","Doctrine",`Stazzism is a Stazzist doctrine developed by Kelvin Stazzland and the ethical, social, and philosophical foundation of Stazzeria. It emphasizes kindness, mutual support, continuous improvement, loyalty, family bonds, self-governance, responsibility, discipline, collective accountability, informed decision-making, and Action Over Words: implementing knowledge responsibly instead of relying on declarations alone.`]
"064":["Stazzist","Person / Adjective",`Stazzist is a person who follows, practices, supports, or identifies with Stazzism and its principles. The term may also describe ideas, actions, or practices that are consistent with the Stazzism Doctrine.`],
"065":["Stazzist Doctrine","Doctrine",`A Stazzist Doctrine is a formal system of principles, beliefs, and guiding philosophies associated with Stazzist thought and practice. Stazzism, developed by Kelvin Stazzland, is a Stazzist doctrine that establishes the ethical, social, and philosophical foundation of Stazzeria. It emphasizes Action Over Words, informed decision-making, responsible implementation, kindness, mutual support, continuous improvement, loyalty, self-governance, discipline, and collective accountability.`]
"066":["Stazzland","Lineage / Family",`Stazzland is the family name and personal identity associated with Kelvin Stazzland and the Stazzland birthright lineage. Within the Stazzerian Framework, the name is also associated with the family’s heritage, estate, and continuity.`],
"067":["The Stazzlies","People / Category",`The Stazzlies are the collective of female Stazzerians, representing feminine identity, participation, and cultural expression within Stazzeria. Led by the Stazzerian First Lady, The Stazzlies constitute the recognized female collective within the Stazzerian Framework. All Stazzlies are Stazzerians, but not all Stazzerians are Stazzlies.`]
"068":["Stazzology","Brand",`Stazzology is an independent gaming and competitive entertainment brand associated with Stazzboi, primarily focused on Call of Duty: Mobile (CODM). It develops gaming content and organizes or promotes competitive events, teams, tournaments, and related media, including Stazzboi Gaming. Its activities also include promotions such as the April 11, 2026 Bites & Battles Street Fighter 6 tournament at Megabites Arcade in Hemet, California. Stazzology is not a department, subordinate institution, or member of Stazzeria; its connection to Stazzeria is through Stazzboi and The Stazz Universe.`]
"069":["STAZZsociety","Polyfunctional Lexeme",`STAZZsociety is the polyfunctional lexeme commonly used to refer to the Stazzerian Framework. It encompasses the interconnected language, culture, identity, principles, governance, institutions, concepts, and practices that collectively constitute the Stazzerian system.`],
"070":["Supporter","Citizenship",`Stazzerian Supporter refers to a Stazzerian citizenship classification for an individual who is recognized as a supporter or participant of Stazzeria without possessing Birthright or Adopted Stazzerian citizenship. Supporter status functions as the equivalent of a Stazzerian visa, providing a recognized connection to Stazzeria without establishing birthright or adopted citizenship.`],
"071":["Takeover","Event",`Takeover is an event hosted by Stazzology as part of the Stazzology Season. It is one of multiple events organized under Stazzology's seasonal programming.`]
"072":["The Khamelion","Identity / Concept",`The Khamelion is a professional identity and persona of Kelvin Stazzland, professionally known as Stazzboi. Bestowed upon him by his inner circle, the title represents his adaptability, versatility, and ability to navigate different environments while maintaining his distinctive identity. It is also the identity from which the Khamelion Pose derives.`]
"073":["Valor","Team",`Valor is a team recognized within the Stazzology competitive event system. It is identified as one of the teams associated with Stazzology's organized activities and competitions.`]
"074":["WarGames","Event",`WarGames is an event hosted by Stazzology as part of the Stazzology Season. It features an open-roster competitive format in which participants may compete without being restricted to a fixed team roster. WarGames serves as one of multiple events organized under Stazzology's seasonal programming.`]
"075":["Zits Conflict","Historical / History",`The Zits Conflict was a social confrontation in Stazzerian history involving President Kelvin Stazzland, an opposing individual publicly designated as Zits, First Lady LeAnn Stazzland, and John B. Stazzland. The confrontation began after remarks directed against Stazzeria escalated into an exchange of M&M pellets. Zits initiated the exchange, President Stazzland responded, and John B. joined the Stazzerian side, contributing significantly to its victory. The conflict included a temporary truce that was subsequently violated before hostilities ceased. First Lady LeAnn Stazzland played a central role in resolving the confrontation and establishing peace. John B. was subsequently appointed Stazzerian War General. Within Stazzerian history, the conflict is remembered as a decisive Stazzerian victory and an example of loyalty, collective defense, symbolic confrontation, and diplomatic resolution.`]
"076":["StazzQueen","Title",`StazzQueen is a formal title within the Stazzian and Stazzerian household structure, referring to the recognized female counterpart to Stazz King. Associated with the Stazzland household, commonly referred to as The Stazzerian Castle, the title represents the feminine identity within the household. StazzQueen is a personal designation distinct from the institutional office of First Lady of Stazzeria; holding the office of First Lady does not automatically confer the title of StazzQueen.`]
"077":["Original StazzQueen (OSQ)","Historical Title",`Original StazzQueen (OSQ) is a Stazzerian historical designation assigned to Amy Stazzland, derived from the title StazzQueen to distinguish her as its original and foundational holder. Within the Stazzerian household structure, the designation recognizes Amy Stazzland's role in Kelvin Stazzland's life and her significance as the foundational model for the StazzQueen role, including her historical association with The Stazzian Estate and The Stazzerian Castle. The title preserves her distinction as the original StazzQueen within Stazzerian history.`]
"078":["Stazz King","Personal Title",`Stazzerian King or Stazz King is a formal Stazzerian title reserved solely for Kelvin Stazzland, including when he is not occupying public office. The title represents his masculine identity within the Stazzland household, with StazzQueen serving as its feminine counterpart. Together, the titles reference the Stazzland household, commonly known as The Stazzerian Castle.`]
"079":["Stazzerian Castle","Place / Household",`The Stazzerian Castle is the recognized name and enduring concept of the Stazzland household, representing the familial, romantic, and personal household structure associated with Kelvin Stazzland, the Stazz King, and the StazzQueen. Originating from the foundational Stazzland household, the Castle symbolizes affection, stability, continuity, and the ongoing development of the household within Stazzerian culture and history. Closely associated with The Stazzian Estate, the Castle continues as a household concept beyond its original formation. Kelvin Stazzland personally refers to it as “The Castle,” “My Castle,” and “Our Castle”.`],
"080":["Department of Stazz (DOS)","Government Institution / Executive Administration",`The Department of Stazz (DOS) is the central governmental and executive administrative institution of Stazzeria. It comprises the recognized offices and leadership structure responsible for administering Stazzerian governance, coordinating institutional affairs, and carrying out the principles of Stazzerian Presidential Collectivism. Its motto is Ordo in Chao (Order in Chaos). Official titles: President of Stazzeria; Stazzerian President. Vice President of Stazzeria; Stazzerian Vice President. War General of Stazzeria; Stazzerian War General. First Judge of Stazzeria; Stazzerian First Judge. Monarch of Stazzeria; Stazzerian Monarch. Mediator of Stazzeria; Stazzerian Mediator. Advisor of Stazzeria; Stazzerian Advisor. Head of Stazz. First Lady of Stazzeria; Stazzerian First Lady. Secret Service of Stazzeria; Stazzerian Secret Service. Reference entries: STX-009 Stazzeria; STX-051 Stazzerian Presidential Collectivism; STX-063 Stazzism.`],
"081":["STXC","Content Indexing System",`STXC is the content-indexing system of The Stazzex, established to identify, classify, document, and preserve creative and media content associated with The Stazz Universe. STXC entries function according to the same archival and reference principles as standard STX entries but are specifically designated for content records. Each STXC entry receives an identifier beginning with STX-C: to distinguish content documentation from the general Stazzerian Index. Example: STX-C:001.`]
};const k=(new URLSearchParams(location.search).get('stx')||'001').padStart(3,'0'),v=D[k]||['STAZZEX Entry','Canonical','Canonical Stazzerian Index entry.'];document.title='STX '+k+' — '+v[0];document.getElementById('title').textContent=v[0];document.getElementById('subtitle').textContent='STX '+k+' · '+v[1];document.getElementById('meta').textContent='STX '+k+' · The Stazzex';document.getElementById('definition').innerHTML='<p>'+v[2]+'</p>';if(k==='049'){document.getElementById('route').innerHTML='<a href="/vice-president/">View the Stazzerian Vice President page →</a>';}else{document.getElementById('route').style.display='none';}</script><script src="/assets/stazz-app.js?v=20260928" defer></script></body></html>
